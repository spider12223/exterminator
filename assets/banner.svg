<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-labelledby="title desc">
  <title id="title">exterminator</title>
  <desc id="desc">A stick-figure exterminator sprays a code bug while its headlamp reveals a whole nest of bugs hiding in the code behind it.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.4" fill="#E2DCCF"/>
    </pattern>
    <linearGradient id="beam" x1="339" y1="0" x2="1216" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ECFCCB" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#D9F99D" stop-opacity="0.7"/>
    </linearGradient>
    <clipPath id="beamClip">
      <path d="M339,210 L1216,150 L1216,390 Z"/>
    </clipPath>
    <clipPath id="panelClip">
      <rect x="772" y="136" width="442" height="300" rx="14"/>
    </clipPath>
    <symbol id="bug" viewBox="-26 -28 52 52" overflow="visible">
      <g stroke="#111" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-9,-3 L-19,-10"/><path d="M-10,3 L-21,3"/><path d="M-9,9 L-19,16"/>
        <path d="M9,-3 L19,-10"/><path d="M10,3 L21,3"/><path d="M9,9 L19,16"/>
        <path d="M-4,-16 Q-7,-23 -12,-24" stroke-width="2.5"/><path d="M4,-16 Q7,-23 12,-24" stroke-width="2.5"/>
      </g>
      <ellipse cx="0" cy="4" rx="11" ry="14" fill="#111"/>
      <path d="M0,-6 L0,17" stroke="#5A564E" stroke-width="1.6"/>
      <circle cx="-5" cy="3" r="2.2" fill="#A3E635"/>
      <circle cx="5" cy="9" r="2.2" fill="#A3E635"/>
      <circle cx="0" cy="-12" r="7" fill="#111"/>
      <circle cx="-3.4" cy="-13" r="3" fill="#fff"/>
      <circle cx="3.4" cy="-13" r="3" fill="#fff"/>
      <circle cx="-3.4" cy="-13.6" r="1.4" fill="#111"/>
      <circle cx="3.4" cy="-13.6" r="1.4" fill="#111"/>
    </symbol>
  </defs>

  <!-- card -->
  <rect width="1280" height="520" rx="28" fill="#F4F1EA"/>
  <rect width="1280" height="520" rx="28" fill="url(#dots)"/>

  <!-- wordmark -->
  <text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="58" font-weight="800" fill="#111" letter-spacing="-1">exterminator<tspan fill="#84CC16">_</tspan></text>
  <text x="66" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="21" fill="#6B6558">fix the bug. then find the nest.</text>

  <!-- code panel (the wall) -->
  <rect x="780" y="102" width="446" height="346" rx="18" fill="#111"/>
  <rect x="770" y="92" width="446" height="346" rx="18" fill="#FFFFFF" stroke="#111" stroke-width="5"/>
  <line x1="770" y1="134" x2="1216" y2="134" stroke="#111" stroke-width="4"/>
  <circle cx="797" cy="113" r="6.5" fill="#EF4444" stroke="#111" stroke-width="2.5"/>
  <circle cx="819" cy="113" r="6.5" fill="#F59E0B" stroke="#111" stroke-width="2.5"/>
  <circle cx="841" cy="113" r="6.5" fill="#A3E635" stroke="#111" stroke-width="2.5"/>
  <text x="1000" y="119" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8A8478">checkout.js</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#BDB7AA" text-anchor="end">
    <text x="806" y="166">1</text><text x="806" y="190">2</text><text x="806" y="214">3</text>
    <text x="806" y="238">4</text><text x="806" y="262">5</text><text x="806" y="286">6</text>
    <text x="806" y="310">7</text><text x="806" y="334">8</text><text x="806" y="358">9</text>
    <text x="806" y="382">10</text><text x="806" y="406">11</text>
  </g>
  <g>
    <rect x="822" y="157" width="54" height="10" rx="5" fill="#4B4740"/><rect x="884" y="157" width="120" height="10" rx="5" fill="#DDD8CC"/><rect x="1012" y="157" width="36" height="10" rx="5" fill="#A3E635"/>
    <rect x="846" y="181" width="70" height="10" rx="5" fill="#DDD8CC"/><rect x="924" y="181" width="90" height="10" rx="5" fill="#DDD8CC"/>
    <rect x="846" y="205" width="40" height="10" rx="5" fill="#4B4740"/><rect x="894" y="205" width="150" height="10" rx="5" fill="#DDD8CC"/><rect x="1052" y="205" width="60" height="10" rx="5" fill="#A3E635"/>
    <rect x="870" y="229" width="110" height="10" rx="5" fill="#DDD8CC"/><rect x="988" y="229" width="70" height="10" rx="5" fill="#DDD8CC"/>
    <rect x="870" y="253" width="60" height="10" rx="5" fill="#4B4740"/><rect x="938" y="253" width="140" height="10" rx="5" fill="#DDD8CC"/>
    <rect x="846" y="277" width="90" height="10" rx="5" fill="#DDD8CC"/><rect x="944" y="277" width="50" height="10" rx="5" fill="#A3E635"/><rect x="1002" y="277" width="80" height="10" rx="5" fill="#DDD8CC"/>
    <rect x="846" y="301" width="40" height="10" rx="5" fill="#4B4740"/><rect x="894" y="301" width="120" height="10" rx="5" fill="#DDD8CC"/>
    <rect x="870" y="325" width="140" height="10" rx="5" fill="#DDD8CC"/><rect x="1018" y="325" width="60" height="10" rx="5" fill="#DDD8CC"/>
    <rect x="846" y="349" width="60" height="10" rx="5" fill="#4B4740"/><rect x="914" y="349" width="100" height="10" rx="5" fill="#DDD8CC"/><rect x="1022" y="349" width="50" height="10" rx="5" fill="#A3E635"/>
    <rect x="822" y="373" width="30" height="10" rx="5" fill="#4B4740"/>
    <rect x="822" y="397" width="90" height="10" rx="5" fill="#DDD8CC"/><rect x="920" y="397" width="70" height="10" rx="5" fill="#DDD8CC"/>
  </g>
  <!-- error squiggle -->
  <path d="M870,270 q5,-5 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>

