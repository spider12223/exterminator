<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bugcam demo shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-fixed>
<!-- bugcam demo, FIXED version: the image reserves its space (width/height), app.js updates the cart
     count in place (data-fixed), and the stock check uses the right URL. -->
<div id="cart-empty" class="banner" role="alert">Your cart is empty</div>
<header><span class="logo">demo shop</span><input id="q" type="search" placeholder="Search" aria-label="Search"><span class="cart">Cart: <b id="cart-count">0</b></span></header>
<main>
  <h1>Red sneakers</h1>
  <img id="hero" src="hero.svg" alt="" width="480" height="160">
  <p class="price">$89 <span id="stock">checking stock...</span></p>
  <button id="buy" type="button">Add to cart</button>
  <p class="small">Free returns within 30 days.</p>
</main>
<script src="app.js"></script>
</body>
</html>
